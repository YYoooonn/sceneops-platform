x-worker-common: &worker-common
  build:
    context: .
    dockerfile: apps/worker/Dockerfile
  image: sceneops-platform/worker:local
  env_file:
    - .env.local
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  volumes:
    - ./data:/data
    - ./scripts:/workspace/scripts:ro

services:
  postgres:
    image: postgres:16
    container_name: sceneops-postgres
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - sceneops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sceneops -d sceneops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sceneops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: sceneops-minio
    command: server /data --console-address ":9001"
    env_file:
      - .env.local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - minio

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    container_name: sceneops-minio-init
    env_file:
      - .env.local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init/minio_init.sh"]
    volumes:
      - ./data/raw:/data/raw:ro
      - ./scripts:/scripts:ro
    profiles:
      - minio

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: sceneops-platform/api:local
    container_name: sceneops-api
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 20

  worker-pipeline:
    <<: *worker-common
    container_name: sceneops-worker-pipeline
    command: >
      celery
      -A sceneops_worker.celery_app.celery_app
      worker
      --loglevel=info
      --queues=sceneops.pipeline_runs
      --concurrency=${SCENEOPS_WORKER_PIPELINE_CONCURRENCY:-1}
      --hostname=sceneops-pipeline@%h
    profiles:
      - worker

  worker-jobs:
    <<: *worker-common
    container_name: sceneops-worker-jobs
    command: >
      celery
      -A sceneops_worker.celery_app.celery_app
      worker
      --loglevel=info
      --queues=sceneops.jobs
      --concurrency=${SCENEOPS_WORKER_JOBS_CONCURRENCY:-4}
      --hostname=sceneops-jobs@%h
    profiles:
      - worker

  worker-cli:
    <<: *worker-common
    container_name: sceneops-worker-cli
    profiles:
      - debug

  migrate:
    build:
      context: .
      dockerfile: migrations/Dockerfile.migrate
    env_file:
      - .env.local
    volumes:
      - ./migrations:/workspace/migrations
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "alembic",
        "-c",
        "migrations/alembic.ini",
        "upgrade",
        "head"
      ]

  inference-server:
    build:
      context: .
      dockerfile: apps/inference-server/Dockerfile
      args:
        TORCH_FLAVOR: cu121
    image: sceneops-platform/inference-server:gpu-local
    container_name: sceneops-inference-server
    env_file:
      - .env.local
    environment:
      HF_HOME: /cache/hf
      SCENEOPS_INFERENCE_HF_CACHE_DIR: /cache/hf
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data:ro
      - ./cache/hf:/cache/hf
    networks:
      default:
        aliases:
          - sceneops-inference
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu

  inference-server-local:
    build:
      context: .
      dockerfile: apps/inference-server/Dockerfile
    image: sceneops-platform/inference-server:local
    container_name: sceneops-inference-server-local
    env_file:
      - .env.local
    environment:
      HF_HOME: /cache/hf
      SCENEOPS_INFERENCE_HF_CACHE_DIR: /cache/hf
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data:ro
      - ./cache/hf:/cache/hf
    networks:
      default:
        aliases:
          - sceneops-inference
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    profiles:
      - inference

volumes:
  sceneops_postgres_data:
  redis-data:
  minio-data:
