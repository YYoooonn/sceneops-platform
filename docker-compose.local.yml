services:
  postgres:
    image: postgres:16
    container_name: sceneops-postgres
    environment:
      POSTGRES_USER: sceneops
      POSTGRES_PASSWORD: sceneops
      POSTGRES_DB: sceneops
    ports:
      - "5432:5432"
    volumes:
      - sceneops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sceneops -d sceneops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sceneops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: sceneops-platform/api:local
    container_name: sceneops-api
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker-cli:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: sceneops-platform/worker:local
    container_name: sceneops-worker-cli
    env_file:
      - .env.local
    volumes:
      - ./data:/data
      - ./scripts:/workspace/scripts:ro
    entrypoint: ["sceneops-worker"]
    command: ["--help"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - debug

  worker-celery:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: sceneops-platform/worker:local
    container_name: sceneops-worker-celery
    env_file:
      - .env.local
    volumes:
      - ./data:/data
      - ./scripts:/workspace/scripts:ro
    command:
      [
        "celery",
        "-A",
        "sceneops_worker.celery_app:celery_app",
        "worker",
        "--loglevel=info",
        "-Q",
        "sceneops.pipeline_runs,sceneops.jobs",
        "--concurrency=1"
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: sceneops-platform/api:local
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./packages/sceneops-db/alembic:/app/packages/sceneops-db/alembic
    working_dir: /app
    command:
      [
        "alembic",
        "-c",
        "packages/sceneops-db/alembic.ini",
        "upgrade",
        "head"
      ]
    profiles:
      - tools

volumes:
  sceneops_postgres_data:
  redis-data:
