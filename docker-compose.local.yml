x-worker-common: &worker-common
  build:
    context: .
    dockerfile: apps/worker/Dockerfile
  image: sceneops-platform/worker:local
  env_file:
    - .env.local
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
  volumes:
    - ./data:/data
    - ./scripts:/workspace/scripts:ro

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: sceneops-platform/airflow:local
  env_file:
    - .env.local
    - .env.airflow.local
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    HOST_DATA_DIR: ${PWD}/data
  volumes:
    - ./airflow/dags:/opt/airflow/dags
  depends_on:
    airflow-postgres:
      condition: service_healthy
  profiles:
    - airflow

networks:
  default:
    name: sceneops-network

services:
  postgres:
    image: postgres:16
    container_name: sceneops-postgres
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      - sceneops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sceneops -d sceneops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sceneops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: sceneops-minio
    command: server /data --console-address ":9001"
    env_file:
      - .env.local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - minio

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    container_name: sceneops-minio-init
    env_file:
      - .env.local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init/minio_init.sh"]
    volumes:
      - ./data/raw:/data/raw:ro
      - ./scripts:/scripts:ro
    profiles:
      - minio

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: sceneops-platform/api:local
    container_name: sceneops-api
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 20

  worker-pipeline:
    <<: *worker-common
    container_name: sceneops-worker-pipeline
    command: >
      celery
      -A sceneops_worker.celery_app.celery_app
      worker
      --loglevel=info
      --queues=sceneops.pipeline_runs
      --concurrency=${SCENEOPS_WORKER_PIPELINE_CONCURRENCY:-1}
      --hostname=sceneops-pipeline@%h
    profiles:
      - worker

  worker-jobs:
    <<: *worker-common
    container_name: sceneops-worker-jobs
    command: >
      celery
      -A sceneops_worker.celery_app.celery_app
      worker
      --loglevel=info
      --queues=sceneops.jobs
      --concurrency=${SCENEOPS_WORKER_JOBS_CONCURRENCY:-4}
      --hostname=sceneops-jobs@%h
    profiles:
      - worker

  worker-cli:
    <<: *worker-common
    container_name: sceneops-worker-cli
    profiles:
      - debug

  migrate:
    build:
      context: .
      dockerfile: migrations/Dockerfile.migrate
    env_file:
      - .env.local
    volumes:
      - ./migrations:/workspace/migrations
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "alembic",
        "-c",
        "migrations/alembic.ini",
        "upgrade",
        "head"
      ]

  inference-server:
    build:
      context: .
      dockerfile: apps/inference-server/Dockerfile
      args:
        TORCH_FLAVOR: cu121
    image: sceneops-platform/inference-server:gpu-local
    container_name: sceneops-inference-server
    env_file:
      - .env.local
    environment:
      HF_HOME: /cache/hf
      SCENEOPS_INFERENCE_HF_CACHE_DIR: /cache/hf
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data:ro
      - ./cache/hf:/cache/hf
    networks:
      default:
        aliases:
          - sceneops-inference
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/readyz || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 20
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu

  inference-server-local:
    build:
      context: .
      dockerfile: apps/inference-server/Dockerfile
    image: sceneops-platform/inference-server:local
    container_name: sceneops-inference-server-local
    env_file:
      - .env.local
    environment:
      HF_HOME: /cache/hf
      SCENEOPS_INFERENCE_HF_CACHE_DIR: /cache/hf
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data:ro
      - ./cache/hf:/cache/hf
    networks:
      default:
        aliases:
          - sceneops-inference
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    profiles:
      - inference

  airflow-postgres:
    image: postgres:16
    container_name: sceneops-airflow-postgres
    env_file:
      - .env.airflow.local
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - airflow

  airflow-init:
    <<: *airflow-common
    container_name: sceneops-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      # $$VAR (not ${VAR}) is intentional: this runs as a shell script
      # inside the container, so it should resolve from the container's own
      # env (loaded via env_file: .env.airflow.local above), not from
      # compose-level ${VAR} substitution on the host.
      - >-
        airflow db migrate &&
        airflow users create --username "$$AIRFLOW_ADMIN_USERNAME"
        --password "$$AIRFLOW_ADMIN_PASSWORD"
        --firstname Scene --lastname Ops --role Admin
        --email airflow@sceneops.local || true

  airflow-webserver:
    <<: *airflow-common
    container_name: sceneops-airflow-webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    container_name: sceneops-airflow-scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

volumes:
  sceneops_postgres_data:
  redis-data:
  minio-data:
  airflow_postgres_data:
