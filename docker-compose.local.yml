services:
  postgres:
    image: postgres:16
    container_name: sceneops-postgres
    environment:
      POSTGRES_USER: sceneops
      POSTGRES_PASSWORD: sceneops
      POSTGRES_DB: sceneops
    ports:
      - "5432:5432"
    volumes:
      - sceneops_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sceneops -d sceneops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sceneops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: sceneops-platform/api:local
    container_name: sceneops-api
    env_file:
      - .env.local
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker-cli:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: sceneops-platform/worker:local
    container_name: sceneops-worker-cli
    env_file:
      - .env.local
    volumes:
      - ./data:/data
      - ./scripts:/workspace/scripts:ro
    entrypoint: ["sceneops-worker"]
    command: ["--help"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    profiles:
      - debug

  worker-pipeline:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: sceneops-platform/worker:local
    container_name: sceneops-worker-pipeline
    command: >
      celery
      -A sceneops_worker.celery_app.celery_app
      worker
      --loglevel=info
      --queues=sceneops.pipeline_runs
      --concurrency=1
      --hostname=sceneops-pipeline@%h
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data:/data
      - ./scripts:/workspace/scripts:ro
    profiles:
      - worker

  worker-jobs:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: sceneops-platform/worker:local
    container_name: sceneops-worker-jobs
    command: >
      celery
      -A sceneops_worker.celery_app.celery_app
      worker
      --loglevel=info
      --queues=sceneops.jobs
      --concurrency=4
      --hostname=sceneops-jobs@%h
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data:/data
      - ./scripts:/workspace/scripts:ro
    profiles:
      - worker

  migrate:
    build:
      context: .
      dockerfile: migrations/Dockerfile.migrate
    env_file:
      - .env.local
    volumes:
      - ./migrations/versions:/workspace/migrations/versions
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "alembic",
        "-c",
        "migrations/alembic.ini",
        "upgrade",
        "head"
      ]

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: sceneops-minio
    command: server /data --console-address ":9001"
    env_file:
      - .env.local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - minio

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    container_name: sceneops-minio-init
    env_file:
      - .env.local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init/minio_init.sh"]
    volumes:
      - ./data:/data:ro
      - ./scripts:/scripts:ro
    profiles:
      - minio

  inference-server:
    build:
      context: .
      dockerfile: apps/inference-server/Dockerfile
    image: sceneops-platform/inference-server:local
    container_name: sceneops-inference-server
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu

volumes:
  sceneops_postgres_data:
  redis-data:
  minio-data:
