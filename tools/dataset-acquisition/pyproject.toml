[project]
name = "sceneops-dataset-acquisition"
version = "0.1.0"
description = "Converts external datasets into L1 acquisition input (sensor-shaped ROS 2 MCAP recordings) for SceneOps (ADR-007 §29.13)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "nuscenes-devkit==1.2.0",
  "rosbags>=0.10,<0.11",
  "mcap>=1.2,<2",
  "numpy",
]

[project.scripts]
dataset-acquisition = "dataset_acquisition.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  # Independent decoder for tests: payloads written from rosbags' type store
  # must decode with the MCAP ROS 2 reader the platform itself uses.
  "mcap-ros2-support>=0.5",
]

# Dependency-isolated by design (ADR-007 §29.13, I-36): this project depends
# on dataset SDKs, MCAP and ROS 2 message serialization only -- never on a
# SceneOps package (sceneops-core, -db, -storage, -streaming, -integrations,
# apps). It is not a member of the root uv workspace and has its own uv.lock.
# Its only output is a local MCAP; publication and registration happen
# afterwards through the platform's Recording Publisher and
# REGISTER_ROBOT_RUN. tests/test_import_boundary.py enforces the boundary.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_acquisition"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["tests"]
