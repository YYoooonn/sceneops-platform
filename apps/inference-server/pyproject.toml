[project]
name = "sceneops-inference-server"
version = "0.1.0"
description = "SceneOps GPU inference server (GroundingDINO)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "torch>=2.1",
    "transformers>=4.39",
    "pillow>=10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["inference_server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
