[project]
name = "sceneops-publisher"
version = "0.1.0"
description = "SceneOps Publisher: database-free publication of finalized recordings to the ArtifactStore"
requires-python = ">=3.11,<3.13"
dependencies = [
  "sceneops-core",
  "sceneops-storage",
  "sceneops-recording",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0",
]

[project.scripts]
sceneops-publisher = "sceneops_publisher.cli:main"

[tool.uv.sources]
sceneops-core = { workspace = true }
sceneops-storage = { workspace = true }
sceneops-recording = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["sceneops_publisher"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
