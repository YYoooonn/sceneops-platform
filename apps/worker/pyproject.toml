[project]
name = "sceneops-worker"
version = "0.1.0"
description = "SceneOps worker"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sceneops-core",
    "sceneops-db",
    "sceneops-storage",
    "sceneops-execution",
    "sceneops-acquisition",
    "sceneops-analytics",
    "sceneops-recording",
    "sceneops-scenes",
    "sceneops-episodes",
    "sceneops-derived",
    "sceneops-inference",
    "sceneops-evaluation",
    # No external dataset SDK: datasets reach SceneOps only as recordings
    # converted by integrations/dataset-acquisition (ADR-007 §29.13).
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "celery[redis]>=5.4",
    "mcap>=1.4",
    "mcap-ros2-support>=0.5",
]

[project.scripts]
sceneops-worker = "sceneops_worker.main:app"

[tool.uv.sources]
sceneops-core = { workspace = true }
sceneops-db = { workspace = true }
sceneops-storage = { workspace = true }
sceneops-execution = { workspace = true }
sceneops-acquisition = { workspace = true }
sceneops-scenes = { workspace = true }
sceneops-episodes = { workspace = true }
sceneops-derived = { workspace = true }
sceneops-inference = { workspace = true }
sceneops-evaluation = { workspace = true }
sceneops-analytics = { workspace = true }
sceneops-recording = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["sceneops_worker"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
