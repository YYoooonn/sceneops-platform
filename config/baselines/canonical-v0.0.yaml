# SceneOps canonical development baseline — v0.0
#
# The single authoritative, source-controlled definition of the frozen
# "v0.0" baseline dataset family (see docs/development/canonical-baseline.md
# for the full contract). Every script under scripts/canonical/ reads this
# file rather than hardcoding scene names, dataset identities, or expected
# counts — this is the one place that ordering/identity/expectations live.
#
# v0.0 is immutable once successfully materialized: do not edit this file's
# `scenes`, `datasets`, or `source` sections after v0.0 has been bootstrapped
# anywhere real. A future baseline revision creates a new file
# (canonical-v0.1.yaml) and a new `baseline_version`, it never mutates this
# one in place.

baseline_version: v0.0

# The real nuScenes mini source these scenes are read from. root_uri is the
# in-container path (api/worker bind-mount ./data:/data) — host-side callers
# (this script's own Python/bash tooling, run from the repo root) override it
# via CANONICAL_SOURCE_ROOT_URI, mirroring scripts/e2e/lib.sh's
# E2E_BOOTSTRAP_SOURCE_ROOT_URI convention.
source:
  format: nuscenes
  format_version: v1.0-mini
  root_uri: /data/raw/nuscenes

# The ordered, authoritative 10 real nuScenes mini scenes this baseline is
# built from — validated usable for both the canonical Scene flow and the
# CAN-based robot-learning flow. Deterministic order (ascending scene name);
# every ingestion/replay step below consumes this exact list, never
# re-derives its own ordering.
scenes:
  - scene-0061
  - scene-0103
  - scene-0553
  - scene-0655
  - scene-0757
  - scene-0796
  - scene-0916
  - scene-1077
  - scene-1094
  - scene-1100

# Robot identity + real CAN-replay/alignment knobs for the Episode-bearing
# baselines (sceneops-episodes, sceneops-canonical). Deliberately its own
# identity, never shared with scripts/e2e/lib.sh's test-e2e-* robot
# ("robot-nuscenes-01") — the canonical baseline family must stay
# independent of ephemeral E2E-owned state.
robot:
  robot_id: robot-sceneops-canonical
  platform: nuscenes-can-replay
  replay_rate: 10.0
  record_duration_s: 30
  align_frequency_hz: 5.0

# The three logical baseline DatasetVersions. Each is fully independent
# canonical identity (own DatasetRecord/DatasetVersionRecord, own Scene/
# Episode rows) — never a shared row between them. `domains` says which of
# {scene, episode} this DatasetVersion's canonical-bootstrap step actually
# builds; `expected` is the frozen v0.0 contract canonical-verify checks
# against.
datasets:
  scenes:
    dataset_id: sceneops-scenes
    version: v0.0
    domains: [scene]
    expected:
      scene_count: 10
      episode_count: 0
  episodes:
    dataset_id: sceneops-episodes
    version: v0.0
    domains: [episode]
    expected:
      scene_count: 0
      episode_count: 10
  canonical:
    dataset_id: sceneops-canonical
    version: v0.0
    domains: [scene, episode]
    expected:
      scene_count: 10
      episode_count: 10
