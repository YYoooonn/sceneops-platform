[project]
name = "sceneops-db"
version = "0.1.0"
description = "Shared persistence layer for SceneOps Platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "sceneops-core",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
]

[tool.uv.sources]
sceneops-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["sceneops_db"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
