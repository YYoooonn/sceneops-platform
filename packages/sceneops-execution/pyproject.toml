[project]
name = "sceneops-execution"
version = "0.1.0"
description = "SceneOps execution: Job and Pipeline services, worker leases and ownership, execution recovery, and the Celery dispatch of both"
requires-python = ">=3.11,<3.13"
dependencies = [
  "sceneops-core",
  "sceneops-db",
  "pydantic>=2.0.0",
  "celery[redis]>=5.4",
]

[tool.uv.sources]
sceneops-core = { workspace = true }
sceneops-db = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["sceneops_execution"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
