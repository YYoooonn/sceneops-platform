[project]
name = "sceneops-streaming"
version = "0.1.0"
description = "Kafka-backed telemetry streaming transport for SceneOps Platform"
requires-python = ">=3.11,<3.13"
dependencies = [
  "sceneops-core",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0",
  "confluent-kafka>=2.6,<3.0",
]

[tool.uv.sources]
sceneops-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["sceneops_streaming"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
