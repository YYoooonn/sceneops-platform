[project]
name = "sceneops-analytics"
version = "0.1.0"
description = "Columnar analytical export layer (Postgres/ArtifactStore -> Parquet) for SceneOps"
requires-python = ">=3.11,<3.13"
dependencies = [
  "sceneops-core",
  "sceneops-storage",
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=15.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
# SceneOps V2 Request 2.7D: sceneops_analytics.learning_dataset.torch_adapter
# is the only module that imports torch -- nothing else in this package
# requires it. Install with `sceneops-analytics[torch]`.
torch = ["torch>=2.1"]

[tool.uv.sources]
sceneops-core = { workspace = true }
sceneops-storage = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["sceneops_analytics"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
