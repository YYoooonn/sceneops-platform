[project]
name = "sceneops-inference"
version = "0.1.0"
description = "SceneOps detection inference backends (mock, GroundingDINO client with frustum lifting) and prediction publication"
requires-python = ">=3.11,<3.13"
dependencies = [
  "sceneops-core",
  "sceneops-storage",
  "sceneops-derived",
  "httpx>=0.27",
  "scikit-learn>=1.3",
  "numpy>=1.24",
]

[tool.uv.sources]
sceneops-core = { workspace = true }
sceneops-storage = { workspace = true }
sceneops-derived = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["sceneops_inference"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
