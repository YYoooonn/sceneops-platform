[project]
name = "sceneops-integrations"
version = "0.1.0"
description = "Database-free SceneOps recording publication and reading"
requires-python = ">=3.11,<3.13"
dependencies = [
  "sceneops-core",
  "sceneops-storage",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

# fastapi/uvicorn are no longer used by this package (the HTTP-served
# integration runtime it hosted was removed); they stay declared only so
# the root uv.lock is not re-resolved as part of that removal.
[tool.uv.sources]
sceneops-core = { workspace = true }
sceneops-storage = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["sceneops_integrations"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
