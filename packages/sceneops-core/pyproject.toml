[project]
name = "sceneops-core"
version = "0.1.0"
description = "Shared domain contracts and utilities for SceneOps Platform"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sceneops_core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
