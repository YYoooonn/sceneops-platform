[project]
name = "sceneops-scenes"
version = "0.1.0"
description = "SceneOps Scene domain: Scene building from recordings, validation, profiling and Scene artifact storage"
requires-python = ">=3.11,<3.13"
dependencies = [
  "sceneops-core",
  "sceneops-storage",
  "sceneops-recording",
  "pydantic>=2.0.0",
]

[tool.uv.sources]
sceneops-core = { workspace = true }
sceneops-storage = { workspace = true }
sceneops-recording = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["sceneops_scenes"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
