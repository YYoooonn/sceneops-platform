services:
  migrate:
    build:
      context: .
      dockerfile: migrations/Dockerfile.migrate
    env_file:
      - .env.local
    volumes:
      - ./migrations:/workspace/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - alembic
      - -c
      - migrations/alembic.ini
      - upgrade
      - head
    profiles:
      - tools

  minio-init:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    env_file:
      - .env.local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - /scripts/minio_init.sh
    volumes:
      - ./tools/dev/minio_init.sh:/scripts/minio_init.sh:ro
    profiles:
      - tools
