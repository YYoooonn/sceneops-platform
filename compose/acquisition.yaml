# Batch L1 acquisition (ADR-007 §29.4, §29.13): one-shot data-plane
# containers, run with `docker compose run --rm`. Neither is part of the
# FastAPI control plane; after publication, SceneOps is driven through the
# API (POST /robot-runs:register -> REGISTER_ROBOT_RUN Job).
#
#   dataset-acquisition   external dataset (read-only) -> finalized MCAP in
#                         the acquisition-recordings volume. Own image, no
#                         SceneOps packages, no network, no credentials.
#   recording-publisher   finalized MCAP (read-only) -> recording +
#                         RobotRunManifest in the ArtifactStore. Also runs
#                         the L1 conformance check. Database-free: it gets
#                         ArtifactStore settings only, never DB settings.
#
# acquisition-recordings is the only hand-off between the two: the MCAP
# never passes through the host or the API.
services:
  dataset-acquisition:
    build:
      context: ./integrations/dataset-acquisition
      target: batch
    image: sceneops-platform/dataset-acquisition:local
    network_mode: none
    volumes:
      - ${ACQUISITION_NUSCENES_ROOT:-./data/raw/nuscenes}:/input/nuscenes:ro
      - acquisition-recordings:/recordings
    profiles:
      - acquisition

  # Streaming mode (ADR-007 §29.13): the same tool, in a ROS 2 image, publishes
  # the same acquisition events on ROS 2 topics at the source's pace. It talks
  # DDS to the platform's bridge over the compose network and nothing else:
  # no SceneOps package, no credentials, no Kafka address, no database or
  # object-storage access.
  dataset-replay:
    build:
      context: ./integrations/dataset-acquisition
      target: replay
    image: sceneops-platform/dataset-replay:local
    volumes:
      # `reference replay` reads a fixture's locked recording: the corpus and
      # its lock, and the verified cache. It mounts no source dataset.
      - ./config/reference:/config/reference:ro
      - ${REFERENCE_DATA_ROOT:-./data/reference}:/reference:ro
    profiles:
      - acquisition

  # Reference corpus (config/reference/<corpus>): the same tool and image as
  # dataset-acquisition, run to fingerprint, materialize and verify the corpus
  # fixtures. Recordings land in the local cache ./data/reference (not a
  # Docker volume: it survives `make local-reset`); the lock is written into
  # ./config/reference only by `reference prepare --update-lock`. Run with
  # `--no-deps`: it needs and touches no platform service.
  reference-data:
    build:
      context: ./integrations/dataset-acquisition
      target: batch
    image: sceneops-platform/dataset-acquisition:local
    network_mode: none
    volumes:
      - ${ACQUISITION_NUSCENES_ROOT:-./data/raw/nuscenes}:/input/nuscenes:ro
      - ./config/reference:/config/reference
      - ${REFERENCE_DATA_ROOT:-./data/reference}:/reference
    profiles:
      - acquisition

  # Ground-truth labels of a reference fixture, rendered for a target RobotRun
  # (`reference render-labels`): the locked label artifact in the reference cache
  # in, a sceneops.label_set/v1 document out. It reads no source dataset and
  # mounts none: the cache and the lock are read-only, and the only writable
  # path is the runtime input root that IMPORT_LABELS reads
  # (SCENEOPS_WORKER_INPUT_SOURCE__ROOT_URI, ./data/inputs).
  reference-labels:
    build:
      context: ./integrations/dataset-acquisition
      target: batch
    image: sceneops-platform/dataset-acquisition:local
    network_mode: none
    volumes:
      - ./config/reference:/config/reference:ro
      - ${REFERENCE_DATA_ROOT:-./data/reference}:/reference:ro
      - ./data/inputs:/inputs
    profiles:
      - acquisition

  # L1 conformance of cached reference recordings: the publisher's `check`
  # command (reads the file only; no ArtifactStore, no database), without the
  # MinIO dependency of recording-publisher.
  reference-conformance:
    build:
      context: .
      dockerfile: apps/publisher/Dockerfile
    image: sceneops-platform/publisher:local
    command: ["--help"]
    volumes:
      - ${REFERENCE_DATA_ROOT:-./data/reference}:/reference:ro
    profiles:
      - acquisition

  # Verifiers that compare what the platform derived with the locked reference recording
  # (e2e-scene-ml's lidar payload check). They need the worker's decoders, so this is the
  # worker image with the reference cache mounted read-only and the ArtifactStore settings
  # of the publisher; no other worker container sees the cache.
  reference-verify:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: sceneops-platform/worker:local
    environment:
      SCENEOPS_PUBLISHER_ARTIFACT__BACKEND: ${SCENEOPS_WORKER_ARTIFACT__BACKEND:-}
      SCENEOPS_PUBLISHER_ARTIFACT__ROOT_URI: ${SCENEOPS_WORKER_ARTIFACT__ROOT_URI:-}
      SCENEOPS_PUBLISHER_ARTIFACT__ENDPOINT_URL: ${SCENEOPS_WORKER_ARTIFACT__ENDPOINT_URL:-}
      SCENEOPS_PUBLISHER_ARTIFACT__REGION: ${SCENEOPS_WORKER_ARTIFACT__REGION:-}
      SCENEOPS_PUBLISHER_ARTIFACT__ACCESS_KEY_ID: ${SCENEOPS_WORKER_ARTIFACT__ACCESS_KEY_ID:-}
      SCENEOPS_PUBLISHER_ARTIFACT__SECRET_ACCESS_KEY: ${SCENEOPS_WORKER_ARTIFACT__SECRET_ACCESS_KEY:-}
    volumes:
      - ${REFERENCE_DATA_ROOT:-./data/reference}:/reference:ro
    depends_on:
      minio:
        condition: service_healthy
    profiles:
      - acquisition

  recording-publisher:
    # apps/publisher: database-free, ArtifactStore settings only. Its image holds no
    # database driver, Celery or Kafka client.
    build:
      context: .
      dockerfile: apps/publisher/Dockerfile
    image: sceneops-platform/publisher:local
    command: ["--help"]
    # Publishes into the same ArtifactStore the workers verify from.
    environment:
      SCENEOPS_PUBLISHER_ARTIFACT__BACKEND: ${SCENEOPS_WORKER_ARTIFACT__BACKEND:-}
      SCENEOPS_PUBLISHER_ARTIFACT__ROOT_URI: ${SCENEOPS_WORKER_ARTIFACT__ROOT_URI:-}
      SCENEOPS_PUBLISHER_ARTIFACT__ENDPOINT_URL: ${SCENEOPS_WORKER_ARTIFACT__ENDPOINT_URL:-}
      SCENEOPS_PUBLISHER_ARTIFACT__REGION: ${SCENEOPS_WORKER_ARTIFACT__REGION:-}
      SCENEOPS_PUBLISHER_ARTIFACT__ACCESS_KEY_ID: ${SCENEOPS_WORKER_ARTIFACT__ACCESS_KEY_ID:-}
      SCENEOPS_PUBLISHER_ARTIFACT__SECRET_ACCESS_KEY: ${SCENEOPS_WORKER_ARTIFACT__SECRET_ACCESS_KEY:-}
    volumes:
      - acquisition-recordings:/recordings:ro
      # Prepared reference-corpus recordings are published in place.
      - ${REFERENCE_DATA_ROOT:-./data/reference}:/reference:ro
    depends_on:
      minio:
        condition: service_healthy
    profiles:
      - acquisition

volumes:
  acquisition-recordings:
