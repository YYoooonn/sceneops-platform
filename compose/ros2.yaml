services:
  ros2:
    build:
      # Repo root context (not ./ros2) -- the streaming bridge node needs
      # packages/sceneops-core and packages/sceneops-streaming copied into
      # this image, and Docker COPY cannot reach outside its build
      # context.
      context: .
      dockerfile: ros2/Dockerfile
    image: sceneops-platform/ros2:local
    env_file:
      - .env.local
    volumes:
      - ./data:/data
      - ./ros2/nodes:/workspace/nodes:ro
      # Read-only, matching compose/workers.yaml's identical mount for the
      # worker service -- lets scripts/e2e/ros2_streaming_verify.py run
      # inside this container (real rclpy deserialize_message for every
      # ROS2 message type) without duplicating it into ros2/.
      - ./scripts:/workspace/scripts:ro
      # The durable MCAP capture consumer -- not a ROS2 node (no rclpy
      # Node/pub-sub), but it needs rosbag2_py for standard-format MCAP
      # writing, so it runs in this same ROS2-capable image rather than
      # duplicating ROS2 interface/schema access elsewhere.
      - ./ros2/capture:/workspace/capture:ro
      # Channel-set files shared by the bridge and capture
      # (sceneops_core.streaming.channels).
      - ./ros2/channels:/workspace/channels:ro
      # Captured recordings land here, the same volume the
      # recording-publisher container reads: the MCAP moves between
      # containers without passing through the host or the API.
      - acquisition-recordings:/recordings
    profiles:
      - ros2
