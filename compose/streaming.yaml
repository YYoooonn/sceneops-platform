# Kafka transport for streaming robot telemetry, and the two SceneOps processes that
# attach to it. Opt-in only (`streaming` profile); not part of the default SceneOps stack.
# See docs/architecture/streaming-transport.md.
#
#   kafka             the transport broker (single-node KRaft)
#   streaming-bridge  apps/streaming-bridge: ROS 2 topics -> Kafka (integration adapter).
#                     Run per RobotRun with `docker compose run`; the entrypoint is the app.
#   capture           apps/capture: Kafka -> durable MCAP + capture receipt in the
#                     acquisition-recordings volume. Run per RobotRun with `docker compose run`.

services:
  kafka:
    image: apache/kafka:3.9.2
    env_file:
      - .env.local
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Internal clients use kafka:9092; host tools use the published port.
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      # Allow local-development topics to be created on first publish.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles:
      - streaming

  streaming-bridge:
    build:
      # Repo root context: the image installs sceneops-core and sceneops-streaming
      # from packages/, and Docker COPY cannot reach outside its build context.
      context: .
      dockerfile: apps/streaming-bridge/Dockerfile
    image: sceneops-platform/streaming-bridge:local
    env_file:
      - .env.local
    volumes:
      # Channel-set files shared by the bridge and Capture
      # (sceneops_streaming.channels).
      - ./config/channels:/workspace/channels:ro
    profiles:
      - streaming

  capture:
    build:
      context: .
      dockerfile: apps/capture/Dockerfile
    image: sceneops-platform/capture:local
    env_file:
      - .env.local
    volumes:
      - ./config/channels:/workspace/channels:ro
      # Captured recordings land here, the same volume the publisher containers
      # read: the MCAP moves between containers without passing through the host
      # or the API.
      - acquisition-recordings:/recordings
    profiles:
      - streaming

volumes:
  kafka-data:
