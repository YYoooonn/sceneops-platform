x-worker-common: &worker-common
  build:
    context: .
    dockerfile: apps/worker/Dockerfile
  image: sceneops-platform/worker:local
  env_file:
    - .env.local
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy
  # The runtime sees the local ArtifactStore backend and the dedicated input
  # root (IMPORT_LABELS); never the raw source dataset (./data/raw) or the
  # reference cache (./data/reference).
  volumes:
    - ./data/artifacts:/data/artifacts
    - ./data/inputs:/data/inputs:ro


services:
  worker-pipeline:
    <<: *worker-common
    command: >
      celery
      -A sceneops_worker.celery_app.celery_app
      worker
      --loglevel=info
      --queues=sceneops.pipeline_runs
      --concurrency=${SCENEOPS_WORKER_PIPELINE_CONCURRENCY:-1}
      --hostname=sceneops-pipeline@%h
    profiles:
      - worker

  worker-jobs:
    <<: *worker-common
    command: >
      celery
      -A sceneops_worker.celery_app.celery_app
      worker
      --loglevel=info
      --queues=sceneops.jobs
      --concurrency=${SCENEOPS_WORKER_JOBS_CONCURRENCY:-4}
      --hostname=sceneops-jobs@%h
    profiles:
      - worker


  worker-cli:
    <<: *worker-common
    # Also reads the LeRobot export written by lerobot-integration, and runs the
    # E2E verification scripts mounted at /workspace/scripts
    # (scripts/e2e/e2e_episode_learning.sh).
    volumes:
      - ./data/artifacts:/data/artifacts
      - ./data/inputs:/data/inputs:ro
      - ./data/runs:/data/runs
      - ./scripts:/workspace/scripts:ro
    profiles:
      - debug
